<title>{{ site.title }} | {{site.affiliation}}</title>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ site.description }}">
{% if site.keywords %}
<meta name="keywords" content="{{ site.keywords }}">
{% endif %}
{% if site.canonical %}
<link rel="canonical" href="{{ site.canonical }}"/>
{% endif %}

<link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark }}" type="image/png" />
<link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon }}" type="image/png" />
<script>
  (function() {
    try {
      var mode = localStorage.getItem("theme-mode") || "auto";
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.themeMode = mode;
      document.documentElement.dataset.theme = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
    } catch (error) {}
  })();
</script>
<script src="{{ "/assets/js/favicon-switcher.js" | relative_url }}" type="application/javascript"></script>

<link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin=anonymous>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

{% if site.font == "Sans Serif" %}
<link rel="stylesheet" href="{{ "/assets/css/font_sans_serif.css" | relative_url }}">
{% else %}
<link rel="stylesheet" href="{{ "/assets/css/font.css" | relative_url }}">
{% endif %}
{% if site.auto_dark_mode %}
<link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/publications.css" | relative_url }}">
{% else %}
<link rel="stylesheet" href="{{ "/assets/css/style-no-dark-mode.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/publications-no-dark-mode.css" | relative_url }}">
{% endif %}

<!-- Custom homepage styles -->
<link rel="stylesheet" href="{{ "/assets/css/minimal-custom.css" | relative_url }}">

<meta property="og:title" content="{{ site.title }} | {{ site.affiliation }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.canonical }}">
<meta property="og:image" content="{{ site.avatar | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ site.title }} | {{ site.affiliation }}">
<meta name="twitter:description" content="{{ site.description }}">
<meta name="twitter:image" content="{{ site.avatar | absolute_url }}">
